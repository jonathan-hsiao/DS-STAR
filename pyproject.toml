[project]
name = "ds-star"
version = "0.1.0"
description = "Implementation of Google's DS-Star paper"
authors = [
    {name = "jonathan-hsiao",email = "jhhsiao1@gmail.com"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "python-dotenv>=1.0.0",
    "datasets >=2.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "ds_star", from = "src"}]

[tool.poetry.group.data-analysis.dependencies]
matplotlib = ">=3.5.0"
seaborn = ">=0.12.0"
scipy = ">=1.9.0"
plotly = ">=5.0.0"
scikit-learn = ">=1.0.0"
